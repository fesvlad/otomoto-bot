name: Проверка Otomoto

on:
  schedule:
    - cron: "*/10 * * * *"   # запасной запуск; основной — каждые 2 минуты через cron-job.org
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write             # чтобы сохранять список уже виденных объявлений

concurrency:
  group: otomoto-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Проверить новые объявления
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SEARCH_URL: ${{ vars.SEARCH_URL }}

      - name: Сохранить список виденных объявлений
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Обновить список виденных объявлений"
            git pull --rebase -X theirs origin main || true
            git push
          fi
